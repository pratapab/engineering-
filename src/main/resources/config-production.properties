base.url=https://login.salesforce.com/?locale=in
api.url=https://api.salesforce.com/v1

timeout.default=45
timeout.navigation=90
timeout.assertion=15

browser.type=chrome
browser.headless=true
browser.viewport.width=1920
browser.viewport.height=1080

retry.max=1
retry.screenshot.enabled=true
retry.video.enabled=false

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

user.username=${USER_USERNAME}
user.password=${USER_PASSWORD}
